services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1-trixie}
    image: image-converter-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/workspace/target
    environment:
      CARGO_TARGET_DIR: /workspace/target
      RUST_BACKTRACE: "1"
    stdin_open: true
    tty: true

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1-trixie}
    image: image-converter-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/workspace/target
    environment:
      CARGO_TARGET_DIR: /workspace/target
      RUST_BACKTRACE: "1"
      HOST: 0.0.0.0
      PORT: 4000
      CONVERT_ALLOWED_ORIGIN: ${CONVERT_ALLOWED_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_PORT:-4000}:4000"
    command: cargo run --bin server

  web:
    image: node:24-bookworm-slim
    working_dir: /workspace/apps/web
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/apps/web/node_modules
      - npm-cache:/root/.npm
    environment:
      NEXT_PUBLIC_CONVERT_API_URL: ${NEXT_PUBLIC_CONVERT_API_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      - api

volumes:
  cargo-registry:
  cargo-git:
  target:
  web-node-modules:
  npm-cache:
