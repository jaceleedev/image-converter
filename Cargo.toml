[package]
name = "image_converter"
version = "2.5.0"
edition = "2021"

[lib]
name = "image_converter"
path = "src/lib.rs"

[[bin]]
name = "image_converter"
path = "src/main.rs"

[dependencies]
image = { version = "0.25.10", features = ["avif-native"] }
webp = "0.3.1"
ravif = "0.13.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
colored = "2.1"
indicatif = "0.17"
walkdir = "2.5"
thiserror = "1.0"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.0"
colored = "2.1"

[target.'cfg(unix)'.dev-dependencies]
rexpect = "0.7.0"
